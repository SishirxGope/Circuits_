q6_task_datasets:
  # PRE-REGISTERED 2026-09-12. n=300 prompts per task; the bootstrap resamples
  # TEMPLATES, because prompts from one template are correlated and resampling prompts
  # would return CIs that are too narrow (AI_RULES 4.2 wants the scheme in advance).
  ioi:
    source: ACDC acdc/ioi/ioi_dataset.py @ bc99ace8, seeded edit of Easy-Transformer @ ea15315d (Wang et al., arXiv:2211.00593)
    # CORRECTED 2026-09-14: said "transformer_lens IOI generator", which has only 2 templates.
    n_prompts: 300
    n_templates: 30           # 15 BABA + 15 ABBA, verified from source 2026-09-12
  greater_than:
    # CORRECTED 2026-09-12: the published task is a YEAR-SPAN completion,
    # "The {noun} lasted from the year {year1} to ", NOT day-of-month.
    source: ACDC acdc/greaterthan/utils.py::get_year_data
    n_prompts: 300
    n_templates: 120          # one surface template x 120 NOUNS. CORRECTED 2026-09-14: was 26,
                              # a count of LINES in the upstream list, not of nouns.
  docstring:
    source: ACDC acdc/docstring/prompts.py @ bc99ace8   # VERIFIED 2026-09-14: MIB has no docstring task
    resampling_unit: prompt_stratified_by_style        # PI 2026-09-14: only 2 styles, so 'template' gives n=2
    generator_ported: false
    n_prompts: 300
    n_templates: null
  bootstrap_resampling_unit: template   # ioi (template) and greater_than (noun); docstring overrides above
  prepend_bos: false                    # PI 2026-09-14: matches the ACDC/EAP task setups
  external_download: true     # gated by mode.allow_external_dataset_download
  claims_published_behavior: false
  real_datasets: OPEN

q7_calibration:
  # PRE-REGISTERED 2026-09-12. TWO corpora: calibration and perplexity are different
  # datasets in the reference work, and conflating them breaks the C5 comparison.
  calibration_corpus: fineweb-edu           # ODC-BY
  calibration_tokens: 300000
  calibration_seed: 7                       # reproducing their masks needs the SEED
  perplexity_corpus: wikitext-2-raw-test    # CC BY-SA 3.0
  perplexity_window: 1024
  perplexity_stride: 512
  perplexity_bos_per_window: true
  use: synthetic-calibration
  external_download: false
  real_datasets: OPEN

q8_tracker:
  # PRE-REGISTERED 2026-09-12: Weights & Biases, with local run_meta.json remaining the
  # SOURCE OF RECORD. A tracker is an extra sink, not a dependency -- if W&B is
  # unreachable the run still completes and is still reproducible from run_meta.json +
  # the resolved config hash. Chosen because runs happen on a different machine than
  # the one the paper is written on, which is exactly what a web dashboard is for.
  tracker: wandb
  tracker_is_source_of_record: false
  offline_runs_still_valid: true
  source_of_record: local-json-run_meta
  cloud_trackers: optional-future-integration
  network_logging: false

