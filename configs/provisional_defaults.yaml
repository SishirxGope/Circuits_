  noise: 0.10           # s(e) <= noise -> noise band; otherwise contingent

q2_distance:
  primary: l1                       # L1 over inclusion-frequency vectors
  alternative: jensen_shannon       # over normalized vectors (ablation sensitivity)
  pre_registered_for_stage_c: false

q3_ensemble_sizes:
  synthetic_tests: {B: 4, S: 2, R: 3}
  tiny_local_dry_run: {B: 4, S: 2, R: 3}
