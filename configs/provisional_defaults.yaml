    B: 16
    S: 5
    R: 20
    approved: true                  # IOI pass 42-48 s, greater-than 7.5-7.9 s on the RTX 4060
    re_apply_rule_for: [pythia410m, gemma2_2b, llama32_1b]   # timings not yet measured

q4_threshold_grid:
  design: deterministic-seeded-non-nested
  generated_from: run_seed
  unit_tested: true
  final_design: OPEN                # CIRCUS-style grid remains PI-dependent

