# [AI-GEN] agent=OpenCode date=2026-08-07 task=Root Hydra config (engineering dry-run composition; scientific = explicit override)
# reviewed-by: PENDING
#
# Root composition (ARCHITECTURE.md §3): the grid groups model/, task/, ensemble/,
# distance/, compression/, null/, mode/. Configs are IMMUTABLE once referenced by a
# run (AI_RULES.md 1.2); the resolved config is dumped into every run directory and
# its hash is the run's identity (ARCHITECTURE.md §3).
#
# DEFAULT COMPOSITION = engineering dry-run (PI provisional unblock, 2026-08-07):
# synthetic/mock model, synthetic task, provisional ensemble B4xS2, provisional
# L1/JS distance, local JSON tracking, no model download, no external dataset
# download, no Stage B freeze, no Stage C real compression, no frozen/ writes.
#
# SCIENTIFIC RUNS (final decisions required, configs/mode/scientific_run.yaml):
#   python experiments/run_stage_a.py mode=scientific_run model=pythia160m task=ioi \
#       ensemble=default ensemble/decompose=decompose distance=placeholder ...
# The guard (src/common/config_guard.py) refuses scientific runs while any required
# question is OPEN (HUMAN_DECISIONS.md).

defaults:
  - mode: engineering_dry_run
  - model: mock_model
  - task: synthetic-ioi
  - ensemble: provisional_b4_s2_r3
  - ensemble/decompose: final
  - distance: provisional_l1_js
  - comparison: final   # Q10/Q11 pre-registered 2026-09-12; see configs/comparison/final.yaml
  - calibration: final   # Q7 pre-registered 2026-09-12 (corpora + PPL protocol)
  - compression: placeholder
  - nulls: provisional_r3   # group dir is configs/nulls/ — NOT "null": bare `null` is a
                            # YAML null literal, so `- null: <opt>` parses as a None key
                            # and Hydra never sees the group (fixed 2026-08-08).
                            # provisional_r3 = R=3, matching experiments/dry_run_stage_a.py.
  - _self_

# --- pre-registered statistical settings (2026-09-12) -------------------------------
# These are pre-registration items, not tuning knobs. AI_RULES.md 4.2/4.3 require them
# fixed before the data are seen; they live here so a run records them in its resolved
# config and its hash, rather than inheriting a default buried in a module.
stage_d:
  fdr_q: 0.05            # Benjamini-Hochberg FDR level across the reported grid.
                         # The grid is ~288 per-cell statements; uncorrected at
                         # alpha = 0.05 that yields ~14 "significant" cells under the
                         # global null, so correction is not optional. At q = 0.05, of
                         # the cells called significant at most 5% are expected to be
                         # false discoveries. BH rather than Bonferroni: the cells are
                         # dependent (the same model and task recur across compression
                         # settings) and Bonferroni over ~288 tests would bury a real
                         # single-cell effect.
stage_c:
  n_boot: 1000
  bootstrap_axes: [B, S, r]   # proposal 2.1c / CLAUDE.md 5. Resampling the ensemble
                              # axes as well as the null draws WIDENS every CI; fixed
                              # before any result exists, which is the point.
  # Chance-floor candidate-edge universe N, DECIDED 2026-09-14 (PI): the number of
  # STRUCTURALLY POSSIBLE edges among the observed nodes. The earlier U*(U-1) over node
  # strings counts pairs that can never be edges (inputs never send; nothing flows backwards):
  # 8.7x too many on IOI and 6.3x on greater-than, lowering the random-overlap floor ~10x.
  # For dense-node the possible pairs are src/extraction/eap.py::candidate_edges; pipeline A
  # needs its own structural rule before it runs.
  chance_floor_universe: structural_edges_among_observed_nodes
  chance_floor_universe_implemented: false   # run_stage_c still computes U*(U-1)

stage: stageA            # Algorithm 1 stage: stageA (dense reference) for this entrypoint
seed: 0                  # base seed; the S ensemble seeds are seed, seed+1, ..., seed+S-1
run_root: runs           # run directories: {run_root}/{run_name} (CLAUDE.md §4 naming)
pipeline: mock           # attr | edgeprune | dense-node | mock
                         #   mock = synthetic extractor for dry-runs (no model download, no GPU)
setting: dense           # compression-or-null run-name token (CLAUDE.md §4); Stage A = dense reference
comparison_level: both   # exact-edge | routing-head | both — every claim is stated at both levels (CLAUDE.md §5, claim C2)
compression_family: dense  # Stage A runs on the dense reference; families (rtn/gptq/awq/magnitude/wanda) are Stage C
compression_level: null    # bit-width / sparsity; null for the dense reference

# Run name per CLAUDE.md §4 — DERIVED BY THE STAGE RUNNER, not interpolated here.
#
# It used to be `${now:%Y%m%d}_${stage}_..._${ensemble.configset}_seed${seed}`, but
# `ensemble.configset` never contains R, so every Stage B/C/D run launched through
# Hydra was named `B4xS2` instead of `B4xS2xR3`. CLAUDE.md §4 requires the configset
# token to encode B, S AND R "so ensemble size is legible from the run name", and a
# null run whose name hides R is exactly the case that matters.
#
# Each runner builds the name from its own (B, S, R), so it is always correct for the
# stage. Set this explicitly only to override; it is then validated against the
# derived value and refused on mismatch.
run_name: null

hydra:
  run:
    dir: .                # run_stage_a creates {run_root}/{run_name}; hydra stays in place
  output_subdir: null
